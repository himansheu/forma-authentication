<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/css/forma.css">
<title>Sign in – FORMA</title>
</head>
<body class="page">
<a class="skip" href="#form">Skip to the form</a>

<aside class="rail">
  <a class="rail__word" href="/" aria-label="FORMA home">forma</a>
</aside>

<main class="stage">
  <header class="intro">
    <h1>Sign in</h1>
    <p>Say who you are. Your mark appears once we know it's you.</p>
  </header>

  <div class="mark-wrap">
    <svg id="mark" class="mark" focusable="false"></svg>
  </div>

  <form id="form" class="sentence" action="/api/login" method="post" novalidate>
    <div class="clause clause--long">
      <div class="clause__row">
        <label class="clause__lead" for="identifier">I'm<span class="sr-only"> (your username or email)</span></label>
        <input id="identifier" name="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required aria-describedby="identifier-note" placeholder="username or email">
      </div>
      <p class="clause__note" id="identifier-note" data-hint=""></p>
    </div>

    <div class="clause">
      <div class="clause__row">
        <label class="clause__lead" for="password">and my password is<span class="sr-only"> (your password)</span></label>
        <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-note">
        <button class="reveal" type="button" aria-controls="password" aria-label="Show password">Show</button>
      </div>
      <p class="clause__note" id="password-note" data-hint=""></p>
    </div>

    <p class="alert" role="alert" hidden></p>

    <div class="actions">
      <button class="btn" type="submit" data-busy="Checking…"><span class="btn__label">Sign in</span></button>
      <p class="aside">New here? <a href="/register">Open an account</a></p>
    </div>
  </form>

  <section id="done" class="done" tabindex="-1" hidden>
    <h2>Welcome back, <span data-name></span>.</h2>
    <p>Taking you to your page. <a href="/dashboard">Go now</a></p>
  </section>

  <noscript><p class="alert">FORMA needs JavaScript to send the form. Turn it on and reload.</p></noscript>
</main>

<script type="module" src="/js/login.js"></script>
</body>
</html>
